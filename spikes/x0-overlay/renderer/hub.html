<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADE X0 Hub</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #1b2433; color: #fff; }
    header { height: 38px; box-sizing: border-box; padding: 9px 12px; background: #30415b; font-size: 13px; font-weight: 700; -webkit-app-region: drag; }
    main { padding: 16px; }
    label { display: block; font-size: 13px; margin-bottom: 8px; }
    input { width: 100%; box-sizing: border-box; padding: 9px; border: 0; border-radius: 5px; font-size: 15px; -webkit-app-region: no-drag; }
    small { display: block; margin-top: 14px; color: #b9c6d9; }
  </style>
</head>
<body>
  <header>ADE X0 Hub — drag here</header>
  <main>
    <label for="message">Type to change the overlay bubble</label>
    <input id="message" type="text" placeholder="Hub says…" autofocus>
    <small>Esc blurs · Ctrl+Q quits and writes X0-REPORT.md</small>
  </main>
  <script src="hub.js"></script>
</body>
</html>
