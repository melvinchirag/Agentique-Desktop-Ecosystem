<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADE X0 Overlay</title>
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { font-family: system-ui, sans-serif; user-select: none; }
    canvas { display: block; }
    .critter-hit { position: absolute; bottom: 0; width: 142px; height: 98px; transform: translateX(-50%); cursor: pointer; }
    .bubble { position: absolute; bottom: 125px; transform: translateX(-50%); white-space: nowrap; padding: 9px 13px; border-radius: 14px; background: #fff; color: #172033; font-size: 15px; box-shadow: 0 3px 12px #0004; pointer-events: auto; }
    .bubble::after { content: ''; position: absolute; left: calc(50% - 7px); bottom: -7px; border-width: 8px 7px 0; border-style: solid; border-color: #fff transparent transparent; }
    .diagnostics { position: absolute; top: 8px; left: 8px; padding: 7px 9px; border-radius: 6px; color: white; background: #151b28bd; font: 11px/1.4 Consolas, monospace; white-space: pre-line; pointer-events: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="../dist/overlay.js"></script>
</body>
</html>
